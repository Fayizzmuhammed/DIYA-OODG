<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171b;
    --border: #23272d;
    --gold: #e0b84a;
    --gold-soft: #c9a23f;
    --text: #eceef0;
    --text-dim: #8b9198;
    --green: #3ecf6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    text-align: center;
  }

  .mark {
    width: 88px;
    height: 88px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 0 24px rgba(224, 184, 74, 0.25);
  }

  .mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 0.12em;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .about {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    text-align: left;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .about strong { color: var(--text); }

  .cta {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    color: #1a1400;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    margin-bottom: 14px;
    transition: filter 0.15s ease, transform 0.15s ease;
  }

  .cta:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }

  .note {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 28px;
  }

  .facts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }

  .fact {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .fact .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin: 0 auto 8px;
  }

  footer {
    font-size: 11.5px;
    color: #565b61;
    line-height: 1.6;
  }

  footer a { color: var(--gold-soft); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
